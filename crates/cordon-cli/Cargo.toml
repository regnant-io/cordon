[package]
name = "cordon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cordon command-line tools — node server, keygen, log verifier, provisioning"

[[bin]]
name = "cordon"
path = "src/main.rs"

[[bin]]
name = "cordon-keygen"
path = "src/keygen.rs"

[[bin]]
name = "cordon-verify-log"
