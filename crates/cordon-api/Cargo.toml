[package]
name = "cordon-api"
version = "2.0.0"
edition = "2021"
description = "Cordon HTTP API server — all endpoints from §17"

[dependencies]
cordon-core = { path = "../cordon-core" }
cordon-crypto = { path = "../cordon-crypto" }
cordon-audit = { path = "../cordon-audit" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "tokio", "service"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
cordon-core = { path = "../cordon-core" }
cordon-crypto = { path = "../cordon-crypto" }
reqwest = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
