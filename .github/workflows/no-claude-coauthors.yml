name: Commit attribution

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject Claude co-author trailers
        shell: bash
        run: |
          if git log --all --format=%B | grep -Ei '^[[:space:]]*co-authored-by:.*claude' >/dev/null; then
            echo '::error::Commit history contains a Claude co-author trailer.'
            exit 1
          fi
