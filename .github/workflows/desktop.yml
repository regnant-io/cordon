name: Desktop

# Builds the desktop app with its bundled llama.cpp for Windows, macOS and
# Linux. Every run uploads the installers as artifacts; a pushed `v*` tag also
# attaches them to a draft release for a maintainer to review and publish.

on:
  push:
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths:
      - "desktop/**"
      - "ui/**"
      - "crates/**"
      - "scripts/fetch-llama*"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
          - name: macOS Apple silicon
            os: macos-latest
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            bundles: deb,appimage,rpm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libvulkan1

      - name: Bundle llama.cpp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-llama.ps1
      - name: Bundle llama.cpp (macOS, Linux)
        if: runner.os != 'Windows'
        run: ./scripts/fetch-llama.sh

      - name: Test
        run: cargo test -p cordon-desktop

      - name: Build installers
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: cordon-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
