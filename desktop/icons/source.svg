  <g transform="translate(192 192) scale(20)">
    <path d="M4 22V4H28V28H11V11H21V21" fill="none" stroke="#F2F0E9"
          stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="13.8" y="13.8" width="4.4" height="4.4" fill="#7FB894"/>
  </g>
</svg>
