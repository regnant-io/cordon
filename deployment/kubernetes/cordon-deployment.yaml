---
# Cordon v2.0 — Kubernetes Deployment (Vault / Sovereign Cloud mode)
# Requires: AMD SEV-SNP capable nodes (e.g., Azure DCasv5, GCP N2D)
# NOTE: For Dark/Island modes, use bare-metal deployment — not Kubernetes.

apiVersion: v1
kind: Namespace
metadata:
  name: cordon
  labels:
    app.kubernetes.io/managed-by: "cordon"
    security.cordon/zero-egress: "enforced"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cordon-node
  namespace: cordon
  labels:
    app: cordon

---
# Network policy: zero-egress enforcement at Kubernetes level
# NOTE: hardware firewall is the authoritative control (§4.1)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordon-zero-egress
  namespace: cordon
spec:
  podSelector:
    matchLabels:
      app: cordon
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8443
          protocol: TCP
  egress: []  # Zero egress — no outbound connections permitted

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cordon-config
  namespace: cordon
data:
  cordon.toml: |
    mode = "vault"
    node_id = "k8s-node-001"
    deployment_name = "cordon-k8s"
    deployment_id = "REPLACE_WITH_DEPLOYMENT_ID"
    log_level = "info"

    [network]
    bind_address = "0.0.0.0"
    api_port = 8443
    require_mtls = false
    outbound_policy = "zero_egress"
    hardware_firewall = "none"
    smartnic_acl = false
    tls_cert_path = "/etc/cordon/tls/tls.crt"
    tls_key_path = "/etc/cordon/tls/tls.key"

    [tee]
    preferred = "amd_sev_snp"
    minimum_security_version = 3
    re_attestation_interval_hours = 24
    halt_on_attestation_failure = true
    cache_partitioning = true

    [side_channel]
    constant_time_enforcement = true
    memory_zeroize_on_completion = true
    response_size_padding = true

    [side_channel.timing_normalization]
    enabled = true
    mode = "bucket"
    bucket_ms = 100
    fixed_floor_ms = 0

    [hsm]
    provider = "soft_hsm2"
    fips_level = 1
    slot_id = 0
    pin_env_var = "CORDON_HSM_PIN"

    [boot]
    tpm_required = true
    tpm_version = "2.0"
    secure_boot = true
    dm_verity = true

    [boot.pcr_policy]
    required_pcrs = [0, 4, 7, 8, 11, 13]
    expected_values = {}

    [model_store]
    path = "/var/lib/cordon/bundles"
    integrity_check_interval_minutes = 15
    halt_on_tamper = true

    [inference]
    max_concurrent_requests = 32
    default_timeout_seconds = 120
    client_kv_cache_isolation = true
    kv_cache_zero_on_session_end = true
    multi_tenant = true
    max_input_tokens = 32768
    max_output_tokens = 4096

    [audit]
    log_path = "/var/lib/cordon/audit"
    log_format = "jsonl"
    export_method = "operator_pull"
    retention_days = 365
    signing_key_from_enclave = true

    [updates]
    source = "mgmt_channel"
    require_vendor_signature = true
    require_client_signature = true
    staged_rollout = true
    auto_apply = false

    [sustained_attack]
    auth_failure_threshold_per_minute = 10
    global_failure_threshold_per_minute = 50
    covert_channel_score_threshold = 0.7
    quarantine_on_critical = true
    replay_probe_threshold = 20

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cordon
  namespace: cordon
  labels:
    app: cordon
    version: "2.0.0"
spec:
  serviceName: cordon
  replicas: 1  # Scale via HA deployment — each node independently attested
  selector:
    matchLabels:
      app: cordon
  template:
    metadata:
      labels:
        app: cordon
        version: "2.0.0"
      annotations:
        # AMD SEV-SNP annotation (Azure/GCP specific)
        "confidentialcomputing.azure.com/type": "SevSnp"
    spec:
      serviceAccountName: cordon-node
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cordon
          image: cordon:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: CORDON_HSM_PIN
              valueFrom:
                secretKeyRef:
                  name: cordon-secrets
                  key: hsm-pin
          volumeMounts:
            - name: config
              mountPath: /etc/cordon
              readOnly: true
            - name: tls
              mountPath: /etc/cordon/tls
              readOnly: true
            - name: audit
              mountPath: /var/lib/cordon/audit
            - name: bundles
              mountPath: /var/lib/cordon/bundles
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "64Gi"
              cpu: "16"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8443
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8443
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: cordon-config
        - name: tls
          secret:
            secretName: cordon-tls
  volumeClaimTemplates:
    - metadata:
        name: audit
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "encrypted-ssd"
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: bundles
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "encrypted-ssd"
        resources:
          requests:
            storage: 500Gi

---
apiVersion: v1
kind: Service
metadata:
  name: cordon
  namespace: cordon
  labels:
    app: cordon
spec:
  type: ClusterIP
  selector:
    app: cordon
  ports:
    - name: api
      port: 8443
      targetPort: 8443
      protocol: TCP

---
# Prometheus ServiceMonitor (requires prometheus-operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cordon
  namespace: cordon
spec:
  selector:
    matchLabels:
      app: cordon
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
