# Cordon configuration — light mode
# Generated by cordon 2.0.0
#
# Replace every REPLACE_ME value before use. node_id names this node;
# deployment_id feeds every derived key and must stay stable across
# restarts and match what cordon-keygen was run with.
#
# To exercise the control plane without a model, set
# runtime.backend = "none". Responses are then clearly-labelled
# placeholders rather than generated text.

mode = "light"
node_id = "REPLACE_ME_node_id"
deployment_name = "cordon-dev"
deployment_id = "REPLACE_ME_deployment_id"
log_level = "info"

[network]
outbound_policy = "restricted"
bind_address = "0.0.0.0"
api_port = 8443
tls_cert_path = "/etc/cordon/tls/server.crt"
tls_key_path = "/etc/cordon/tls/server.key"
require_mtls = false

[tee]
preferred = "simulation"
minimum_security_version = 3

[side_channel.timing_normalization]
enabled = false
mode = "none"
bucket_ms = 100
fixed_floor_ms = 1000

[hsm]
fips_level = 1

[boot]
tpm_required = false
tpm_version = "2.0"
secure_boot = false
dm_verity = false

[model_store]
path = "/cordon/bundles"
integrity_check_interval_minutes = 15
halt_on_tamper = true

[inference]
max_concurrent_requests = 32
default_timeout_seconds = 120
kv_cache_zero_on_session_end = true
multi_tenant = true
max_output_tokens = 4096

[audit]
log_path = "/cordon/audit"

[sustained_attack]
auth_failure_threshold_per_minute = 10
global_failure_threshold_per_minute = 50
covert_channel_score_threshold = 0.699999988079071
replay_probe_threshold = 20

[runtime]
backend = "supervised"
model_path = "REPLACE_ME_path_to_model.gguf"
model_dir = "./data/models"
context_size = 4096
gpu_layers = 0
parallel_slots = 4
startup_timeout_seconds = 180
extra_args = []

[ui]
enabled = false
bind_address = "127.0.0.1"
port = 8478

[attestation]
measurement_source = "software_measurement"
interval_hours = 24
halt_until_verified = false

[limits]
max_request_bytes = 1048576
max_messages = 256
max_prompt_chars = 262144
max_connections = 1024
tls_handshake_timeout_seconds = 15

[content_policy]

