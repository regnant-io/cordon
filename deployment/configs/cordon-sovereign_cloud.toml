# Cordon configuration — sovereign_cloud mode
# Generated by cordon 2.0.0
#
# Replace every REPLACE_ME value before use. node_id names this node;
# deployment_id feeds every derived key and must stay stable across
# restarts and match what cordon-keygen was run with.

mode = "sovereign_cloud"
node_id = "REPLACE_ME_node_id"
deployment_name = "cordon-dev"
deployment_id = "REPLACE_ME_deployment_id"
client_registry_path = "/etc/cordon/clients.json"
log_level = "info"

[network]
inbound_whitelist = []
outbound_policy = "zero_egress"
hardware_firewall = "dedicated_appliance"
smartnic_acl = false
bind_address = "0.0.0.0"
api_port = 8443
tls_cert_path = "/etc/cordon/tls/server.crt"
tls_key_path = "/etc/cordon/tls/server.key"
client_ca_path = "/etc/cordon/tls/client-ca.crt"
require_mtls = true

[tee]
preferred = "amd_sev_snp"
minimum_security_version = 3
re_attestation_interval_hours = 24
halt_on_attestation_failure = false
cache_partitioning = true

[side_channel]
constant_time_enforcement = true
memory_zeroize_on_completion = true
response_size_padding = true

[side_channel.timing_normalization]
enabled = false
mode = "none"
bucket_ms = 100
fixed_floor_ms = 1000

[hsm]
provider = "soft_hsm2"
fips_level = 3
slot_id = 0
pin_env_var = "CORDON_HSM_PIN"

[boot]
tpm_required = true
tpm_version = "2.0"
secure_boot = true
dm_verity = true

[boot.pcr_policy]
required_pcrs = [
    0,
    4,
    7,
    8,
    11,
    13,
]

[boot.pcr_policy.expected_values]

[model_store]
path = "/cordon/bundles"
integrity_check_interval_minutes = 15
halt_on_tamper = true

[inference]
max_concurrent_requests = 32
default_timeout_seconds = 120
client_kv_cache_isolation = true
kv_cache_zero_on_session_end = true
multi_tenant = true
max_input_tokens = 32768
max_output_tokens = 4096

[audit]
log_path = "/cordon/audit"
log_format = "jsonl"
export_method = "operator_pull"
retention_days = 365
signing_key_from_enclave = true

[updates]
source = "mgmt_channel"
require_vendor_signature = true
require_client_signature = true
staged_rollout = true
auto_apply = false

[sustained_attack]
auth_failure_threshold_per_minute = 10
global_failure_threshold_per_minute = 50
covert_channel_score_threshold = 0.699999988079071
quarantine_on_critical = true
replay_probe_threshold = 20

[runtime]
backend = "supervised"
model_path = "REPLACE_ME_path_to_model.gguf"
model_dir = "./data/models"
context_size = 4096
gpu_layers = 0
parallel_slots = 4
startup_timeout_seconds = 180
extra_args = []

[ui]
enabled = false
bind_address = "127.0.0.1"
port = 8478

[attestation]
measurement_source = "tpm2"
interval_hours = 24
halt_until_verified = true

[limits]
max_request_bytes = 1048576
max_messages = 256
max_prompt_chars = 262144
max_connections = 1024
tls_handshake_timeout_seconds = 15


# ── Required before this node will start ───────────────────────────
#
# sovereign_cloud mode refuses to boot without pinned expected measurements: with
# nothing to check against, attestation verification would accept any
# report, including one from an impostor.
#
# Start the node once on trusted hardware, read its measurements, review
# them, and paste the result here:
#
#     cordon attest --pin --api https://127.0.0.1:8443
#
# [attestation.expected]
# mrenclave   = "<64 hex characters>"
# mrsigner    = "<64 hex characters>"
# min_isv_svn = 0
#
# [attestation.expected.pcr_values]
# 0  = "sha256:..."   # UEFI firmware
# 4  = "sha256:..."   # bootloader
# 7  = "sha256:..."   # secure boot state
# 11 = "sha256:..."   # Cordon runtime
