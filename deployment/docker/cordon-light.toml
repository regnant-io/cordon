# Cordon v2.0 — Light Mode Configuration
# For development and non-sensitive internal workloads only.
# Light mode does NOT provide hardware TEE protection, timing normalization,
# or hardware zero-egress enforcement.

mode = "light"
node_id = "node-dev-001"
deployment_name = "cordon-dev"
deployment_id = "deployment-dev-001"
log_level = "info"

[network]
bind_address = "0.0.0.0"
api_port = 8443
require_mtls = false
outbound_policy = "zero_egress"
hardware_firewall = "none"
smartnic_acl = false
tls_cert_path = "/var/lib/cordon/tls/server.crt"
tls_key_path = "/var/lib/cordon/tls/server.key"
inbound_whitelist = []

[tee]
preferred = "simulation"
minimum_security_version = 1
re_attestation_interval_hours = 24
halt_on_attestation_failure = false
cache_partitioning = false

[side_channel]
constant_time_enforcement = true
memory_zeroize_on_completion = true
response_size_padding = false

[side_channel.timing_normalization]
enabled = false
mode = "none"
bucket_ms = 100
fixed_floor_ms = 1000

[hsm]
provider = "soft_hsm2"
fips_level = 1
slot_id = 0
pin_env_var = "CORDON_HSM_PIN"

[boot]
tpm_required = false
tpm_version = "2.0"
secure_boot = false
dm_verity = false

[boot.pcr_policy]
required_pcrs = []
expected_values = {}

[model_store]
path = "/var/lib/cordon/bundles"
integrity_check_interval_minutes = 15
halt_on_tamper = true

[inference]
max_concurrent_requests = 32
default_timeout_seconds = 120
client_kv_cache_isolation = true
kv_cache_zero_on_session_end = true
multi_tenant = true
max_input_tokens = 32768
max_output_tokens = 4096

[audit]
log_path = "/var/lib/cordon/audit"
log_format = "jsonl"
export_method = "operator_pull"
retention_days = 365
signing_key_from_enclave = true

[updates]
source = "mgmt_channel"
require_vendor_signature = true
require_client_signature = true
staged_rollout = true
auto_apply = false

[sustained_attack]
auth_failure_threshold_per_minute = 10
global_failure_threshold_per_minute = 50
covert_channel_score_threshold = 0.7
quarantine_on_critical = true
replay_probe_threshold = 20
